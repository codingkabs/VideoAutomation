# Platform catalogue and posting limits.
#
# Tier 1 entries carry the specs the pipeline enforces. Other tiers are the
# research catalogue: `status: planned` means no publisher exists yet.
# Limits were checked September 2026; see docs/platform-research.md.

platforms:

  # ---------------------------------------------------------------- Tier 1
  instagram:
    name: Instagram
    tier: 1
    status: implemented
    regions: [global, uk]
    backends: [meta, zernio]
    default_backend: meta
    video:
      min_s: 3
      max_s: 180          # Reels up to 3 min keep full Reels distribution (API allows 15 min)
      max_mb: 300
      min_fps: 23
      max_fps: 60
    photos:
      max_items: 10       # API carousel cap (the app allows 20)
      max_mb: 8
      size: [1080, 1350]  # 4:5
    caption:
      max_chars: 2200
      max_hashtags: 5
    rate_limit: "100 API posts per rolling 24 h"

  facebook:
    name: Facebook Page
    tier: 1
    status: implemented
    regions: [global, uk]
    backends: [meta, zernio]
    default_backend: meta
    video:
      min_s: 3
      max_s: 90
      max_mb: 1000
      min_fps: 24
      max_fps: 60
    photos:
      max_items: 10
      max_mb: 10
      size: null          # keep original aspect, long edge capped
    caption:
      max_chars: 63206
      max_hashtags: null
    rate_limit: "30 API Reels per rolling 24 h per Page"

  tiktok:
    name: TikTok
    tier: 1
    status: implemented
    regions: [global, uk]
    backends: [zernio]
    default_backend: zernio
    video:
      min_s: 3
      max_s: 600          # per-creator; creator info may report less
      max_mb: 4000
      min_fps: 23
      max_fps: 60
    photos:
      max_items: 35
      max_mb: 20
      size: [1080, 1920]
    caption:
      max_chars: 2200
      max_hashtags: null
      photo_title_max: 90
      photo_description_max: 4000
    rate_limit: "~15 posts/day/creator across all apps; 5 drafts/24 h"

  youtube:
    name: YouTube Shorts
    tier: 1
    status: implemented
    regions: [global, uk]
    backends: [zernio]
    default_backend: zernio
    video:
      min_s: 1
      max_s: 180          # longer videos become regular uploads, not Shorts
      max_mb: 10000
      min_fps: 23
      max_fps: 60
    photos: null          # photo sets become a slideshow video
    caption:
      max_chars: 5000     # description
      max_hashtags: null
      title_max: 100
      tags_max_chars: 500
    rate_limit: "100 uploads/day per API project"

  snapchat:
    name: Snapchat
    tier: 1
    status: implemented
    regions: [global, uk]
    backends: [zernio]
    default_backend: zernio
    video:
      min_s: 5
      max_s: 60
      max_mb: 500
      min_fps: 23
      max_fps: 60
    photos: null          # one media item per post; photo sets become a slideshow
    caption:
      max_chars: 160      # Spotlight description
      max_hashtags: null
      saved_story_title_max: 45
    rate_limit: "not published"

  # ---------------------------------------------------------------- Tier 2
  threads:      {name: Threads, tier: 2, status: planned, regions: [global], route: "Threads API / Zernio", notes: "250 posts/24 h, video <=5 min, 500 chars"}
  x:            {name: X (Twitter), tier: 2, status: planned, regions: [global], route: "X API v2 pay-per-use / Zernio", notes: "~$0.015 per post, 2:20 video, 280 chars"}
  linkedin:     {name: LinkedIn, tier: 2, status: planned, regions: [global], route: "Posts API (w_member_social) / Zernio", notes: "15 min video, vertical boosted"}
  pinterest:    {name: Pinterest, tier: 2, status: planned, regions: [global], route: "API v5 / Zernio", notes: "video pins need a cover"}
  bluesky:      {name: Bluesky, tier: 2, status: planned, regions: [global], route: "AT Protocol / Zernio", notes: "300 chars, 4 images"}
  reddit:       {name: Reddit, tier: 2, status: planned, regions: [global], route: "Reddit API / Zernio", notes: "subreddit rules apply"}
  tumblr:       {name: Tumblr, tier: 2, status: planned, regions: [global], route: "API v2 NPF", notes: ""}
  telegram:     {name: Telegram channel, tier: 2, status: planned, regions: [global, ru, mena], route: "Bot API / Zernio", notes: "50 MB bot limit, 1024-char media caption"}
  mastodon:     {name: Mastodon, tier: 2, status: planned, regions: [global], route: "Mastodon API", notes: "per-instance limits"}
  discord:      {name: Discord, tier: 2, status: planned, regions: [global], route: "Webhook / Zernio", notes: ""}
  vimeo:        {name: Vimeo, tier: 2, status: planned, regions: [global], route: "Upload API", notes: ""}
  dailymotion:  {name: Dailymotion, tier: 2, status: planned, regions: [fr, global], route: "Upload API", notes: ""}
  rumble:       {name: Rumble, tier: 2, status: planned, regions: [us, global], route: "simple-upload API (token on request)", notes: ""}
  vk:           {name: VK Video / Clips, tier: 2, status: planned, regions: [ru, cis], route: "VK API video.save", notes: "Clips 5 s - 3 min"}
  okru:         {name: OK.ru, tier: 2, status: planned, regions: [ru, cis], route: "OK API", notes: ""}
  peertube:     {name: PeerTube, tier: 2, status: planned, regions: [global], route: "REST API", notes: ""}
