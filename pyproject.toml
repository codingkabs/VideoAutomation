[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vauto"
version = "0.1.0"
description = "Post one video or photo set to Instagram, TikTok, Facebook, YouTube Shorts, Snapchat and more."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
s3 = ["boto3>=1.34"]
claude = ["anthropic>=1.8,<2"]
browser = ["playwright>=1.45"]
subtitles = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "flask>=3.0", "playwright>=1.45"]
all = ["flask>=3.0", "boto3>=1.34", "anthropic>=1.8,<2", "playwright>=1.45", "faster-whisper>=1.0"]

[project.scripts]
vauto = "videoautomation.cli:main"

[tool.setuptools.packages.find]
include = ["videoautomation*"]

[tool.setuptools.package-data]
videoautomation = ["config/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
