# Platform catalogue and posting limits.
#
# status:
#   implemented  official API (direct or via Zernio)
#   beta         browser automation or social-auto-upload; works like a person
#                clicking through the site, so selectors may need updating
#   handoff      phone-only app; vauto sends the ready file + caption to your
#                phone (Telegram) or an outbox folder, and you tap post
#   planned      researched, no route built yet
#
# surfaces: what gets created for a video post and for a photo set.
#   photos: null means photo sets are turned into a slideshow video.
# verify: true marks limits that came from a single secondary source.
# Limits checked September 2026; see docs/platform-research.md.

platforms:

  # ======================================================== Tier 1: UK core
  instagram:
    name: Instagram
    tier: 1
    status: implemented
    regions: [global, uk]
    backends: [meta, zernio, handoff]
    default_backend: meta
    zernio_platform: instagram
    surfaces: {video: reel, photos: carousel}
    video: {min_s: 3, max_s: 180, max_mb: 300, min_fps: 23, max_fps: 60}
    photos: {max_items: 10, max_mb: 8, size: [1080, 1350]}
    caption: {max_chars: 2200, max_hashtags: 5}
    rate_limit: "100 API posts per rolling 24 h"
    daily_limit: 100  # posts per rolling 24 h; vauto warns before you hit it

  facebook:
