  # ---------------------------------------------------------------- Tier 4 (mainland China)
  douyin:       {name: Douyin, tier: 4, status: planned, regions: [cn], route: "browser (social-auto-upload)"}
  kuaishou:     {name: Kuaishou, tier: 4, status: planned, regions: [cn], route: "browser (social-auto-upload)"}
